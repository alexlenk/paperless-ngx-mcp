version: 2

project_name: paperless-ngx-mcp

before:
  hooks:
    - go vet ./...
    - go test ./...

builds:
  - id: paperless-ngx-mcp
    main: .
    binary: paperless-ngx-mcp
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  github:
    owner: alexlenk
    name: paperless-ngx-mcp
  # Release candidates (tags containing "-rc", e.g. v0.3.5-fork.2-rc.1) are
  # published but never marked as the latest release.
  make_latest: '{{ if contains .Tag "-rc" }}false{{ else }}true{{ end }}'
